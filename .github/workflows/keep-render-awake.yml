# Keeps the Render free instance awake. Render puts a free web service to sleep after
# 15 minutes without requests, and the first request after that takes about a minute,
# so storefront prices and baskets fail or wait while it wakes.
# Remove this workflow once the service is on a paid (always-on) Render plan.
name: Keep Render awake

on:
  schedule:
    # Every 10 minutes. GitHub can start scheduled runs a few minutes late.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the app
        run: |
          curl --silent --show-error --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors --fail \
            https://cfsconfigurator.onrender.com/
