# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ba56863440a98e9902156dcb72192238"
name = "cfs-configurator"
application_url = "https://cfsconfigurator.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_metaobjects,write_metaobjects,read_inventory,write_draft_orders,read_orders,read_discounts,write_discounts,write_app_proxy"

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "cfs"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/status"
  topics = [ "orders/cancelled", "refunds/create" ]

[auth]
redirect_urls = [ "https://cfsconfigurator.onrender.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
